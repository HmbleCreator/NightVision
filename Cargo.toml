[workspace]
resolver = "2"
members = [
    "crates/nightvision-core",
    "crates/nightvision-cli",
    "crates/nightvision-gui",
    "crates/nightvision-mcu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NightVision Engineering Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/nightvision"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

